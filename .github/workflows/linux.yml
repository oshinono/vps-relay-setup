name: Linux builds

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare toolchain
        run: |
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl armv7-unknown-linux-musleabihf i686-unknown-linux-musl
          cargo install --locked cargo-zigbuild --version 0.24.1
          zig=zig-x86_64-linux-0.15.2
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://ziglang.org/download/0.15.2/$zig.tar.xz"
          echo "02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239  $zig.tar.xz" | sha256sum -c -
          tar -xf "$zig.tar.xz"
          echo "$RUNNER_TEMP/$zig" >> "$GITHUB_PATH"
      - name: Build and verify
        run: |
          ./build-linux.sh
          cd dist
          sha256sum -c SHA256SUMS
          bash -n install.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: relay-tui-linux
          path: dist/
          if-no-files-found: error
      - name: Publish to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo '::warning::Cloudflare credentials missing; only the Actions artifact was published.'
            exit 0
          fi
          npx --yes wrangler@4.164.0 pages deploy dist --project-name "${PAGES_PROJECT:-relay-vps-setup}" --branch main

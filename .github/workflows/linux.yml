name: Linux builds

on:
  push:
    branches: [main]
    paths-ignore:
      - 'install.sh'
      - 'build-linux.sh'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare toolchain
        run: |
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl armv7-unknown-linux-musleabihf i686-unknown-linux-musl
          cargo install --locked cargo-zigbuild --version 0.24.1
          zig=zig-x86_64-linux-0.15.2
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://ziglang.org/download/0.15.2/$zig.tar.xz"
          echo "02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239  $zig.tar.xz" | sha256sum -c -
          tar -xf "$zig.tar.xz"
          echo "$RUNNER_TEMP/$zig" >> "$GITHUB_PATH"
      - name: Build and verify
        run: |
          ./build-linux.sh
          cd dist
          sha256sum -c SHA256SUMS
          bash -n install.sh
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" dist/relay-tui-* dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Linux $tag" \
            --notes "Статические сборки Linux для коммита $GITHUB_SHA." --latest
